[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lognormalize"
version = "0.1.0"
description = "Normalize diverse log formats into structured, standardized models and JSONL with pluggable parsers and streaming iterators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Juan Castin", email = "juancastingo@users.noreply.github.com" },
]
keywords = [
    "logging",
    "log-parser",
    "normalization",
    "syslog",
    "jsonl",
    "logfmt",
    "etl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
lognormalize = "lognormalize.cli:main"

[project.urls]
Homepage = "https://github.com/juancastingo/lognormalize"
Repository = "https://github.com/juancastingo/lognormalize"
Issues = "https://github.com/juancastingo/lognormalize/issues"
